<head>

<link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="FitKal ana sayfa">
      <img src="favicon.svg" width="30" height="30" alt="">
      <span>Fit<b>Kal</b></span>
    </a>
    <nav class="main" aria-label="Ana menü">
      <a href="index.html#araclar">Analiz</a>
      <a href="index.html#program">Program</a>
      <a href="tarifler.html" aria-current="page">Tarifler</a>
      <a href="index.html#ilerleme">İlerleme</a>
    </nav>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Açık/koyu tema">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main class="wrap simple">
  <section class="page-hero">
    <h1>Tarifler</h1>
    <p>100 tarif · porsiyon başına kalori ve besin değerleri</p>
  </section>

  <div class="filters">
    <input type="search" id="fQ" placeholder="Tarif veya malzeme ara…" aria-label="Ara">
    <div class="chips" id="cats" role="group" aria-label="Kategori">
      <button type="button" data-kat="" aria-pressed="true">Tümü</button>
      <button type="button" data-kat="ana" aria-pressed="false">Ana öğün</button>
      <button type="button" data-kat="kahvalti" aria-pressed="false">Kahvaltı</button>
      <button type="button" data-kat="ara" aria-pressed="false">Ara öğün</button>
      <button type="button" data-kat="tatli" aria-pressed="false">Tatlı</button>
    </div>
    <details class="more-filters">
      <summary>Filtreler</summary>
      <div class="mf-body">
        <select id="fPlan" aria-label="Plan">
          <option value="">Tüm planlar</option>
          <option value="dengeli">Dengeli</option>
          <option value="dusuk-karb">Düşük karbonhidrat</option>
          <option value="yuksek-karb">Yüksek karbonhidrat</option>
          <option value="yuksek-protein">Yüksek protein</option>
        </select>
        <select id="fSort" aria-label="Sırala">
          <option value="">Önerilen sıra</option>
          <option value="kcal-asc">Kalori (düşükten)</option>
          <option value="kcal-desc">Kalori (yüksekten)</option>
          <option value="protein">Protein (yüksekten)</option>
          <option value="sugar">Şeker (düşükten)</option>
          <option value="time">Hazırlık süresi</option>
        </select>
        <label class="fit-toggle"><input type="checkbox" id="fFit"> Sadece fit</label>
        <div class="dchips" id="fDiets" role="group" aria-label="Beslenme tercihleri ve alerjiler"></div>
      </div>
    </details>
  </div>

  <div class="count" id="count"></div>
  <div class="rgrid" id="grid"></div>

  <footer>
    <div class="legal"><span>© 2026 FitKal</span><span>Değerler porsiyon başına yaklaşıktır.</span></div>
  </footer>
</main>

<dialog class="recipe" id="dlg" aria-labelledby="dTitle">
  <div class="rd" id="dBody"></div>
</dialog>

<script src="recipes.js?v=6"></script>
<script src="common.js?v=6"></script>
<script src="tarifler.js?v=6"></script>
</body>
</html>
